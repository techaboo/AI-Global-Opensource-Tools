name: Catalog health

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate catalog and snapshot
        id: validation
        run: npm run validate:catalog 2>&1 | tee catalog-health.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-health
          path: catalog-health.txt
          retention-days: 30
      - name: Open or update maintenance issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Automated catalog health check failed';
            const marker = '<!-- catalog-health-bot -->';
            const body = `${marker}\nThe weekly catalog validation failed. Review the latest **Catalog health** workflow run and its report artifact:\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = issues.find(issue => issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
