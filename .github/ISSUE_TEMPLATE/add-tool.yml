name: Add an AI tool
about: Propose an open-source AI project for catalog review
title: "[Tool]: "
labels: ["new-tool"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing. Search existing entries and issues first, then review `docs/METHODOLOGY.md` and `docs/DATA_SCHEMA.md`. Inclusion is editorial and is not an endorsement.
  - type: input
    id: name
    attributes:
      label: Project name
      placeholder: Example Project
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Official public source repository
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official website or documentation
      placeholder: https://example.org
  - type: input
    id: license
    attributes:
      label: License and authoritative source
      description: Provide the license identifier and link to the repository license file.
      placeholder: Apache-2.0 — https://github.com/owner/repository/blob/main/LICENSE
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Proposed primary category
      description: Choose the closest option; secondary capabilities belong in tags.
      options:
        - Foundation Models
        - Conversational AI
        - Agents & Automation
        - Coding Assistants
        - Image Generation
        - Video Generation
        - Audio & Music
        - Speech & Voice
        - Multimodal
        - Vision & Recognition
        - RAG & Retrieval
        - Embeddings
        - Vector Databases
        - Prompt Engineering
        - Fine-Tuning & Training
        - LLMOps & Observability
        - Evaluation & Testing
        - Guardrails & Safety
        - Data & Datasets
        - Document AI
        - Translation & NLP
        - Research Tools
        - Local AI & Inference
        - AI Hardware & Acceleration
        - MLOps Platforms
        - Web & App Builders
        - Specialized AI
        - Other / taxonomy discussion needed
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Neutral summary and AI relevance
      description: Explain what it does, who it serves, and why AI/ML is a material capability. Avoid promotional claims.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Inclusion evidence
      description: Link first-party sources for provenance, implementation, activity, and any material claims.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Primary language and source
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Origin/public-release year and source
  - type: textarea
    id: conflicts
    attributes:
      label: Affiliation or conflict of interest
      description: State your relationship to the project, including employment, maintainership, sponsorship, or “none.”
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for duplicate entries and open proposals.
          required: true
        - label: The linked repository contains a meaningful public implementation, not only a landing page or client stub.
          required: true
        - label: I have not included secrets or unnecessary personal data.
          required: true
        - label: I understand that “Hot” is an editorial label and have not requested it without dated evidence.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
