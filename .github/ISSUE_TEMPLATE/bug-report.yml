name: Bug report
about: Report reproducible incorrect behavior in the Atlas
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, personal data, or unpatched vulnerability details. Use `SECURITY.md` for security-sensitive reports.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected page or view
      description: Remove sensitive search terms from the URL before posting.
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and assistive technology (if applicable)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant console output or screenshots
      description: Redact authorization headers, tokens, private URLs, and personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no secrets or unnecessary personal data.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
