# Daily catalog pipeline, fully autonomous and in this order:
#   1. pull the live state and re-check every repository on GitHub
#   2. remove stale tools
#   3. discover new tools (at least MIN per day, spread across categories)
#   4. verify the result against live GitHub (dead links, duplicates, archived)
#   5. open a PR, wait for the required CI checks and the auto-merge
#   6. confirm the live site serves the new catalog
# Any failure, or a day below the minimum, opens a tracking issue.
name: Daily catalog pipeline

on:
  schedule:
    # Off the hour, so it does not collide with the hourly stats refresh.
    - cron: '20 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum tools to add this run.
        required: false
        type: string
        default: '45'
      minimum:
        description: Daily minimum; the run reports a shortfall below this.
        required: false
        type: string
        default: '30'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: live-data-writer
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A PAT so the PR triggers CI (GITHUB_TOKEN-created PRs do not).
      BOT_TOKEN: ${{ secrets.KIMI_GITHUB_API || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.KIMI_GITHUB_API || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # No dependency install scripts run in a job that holds a write token.
      - run: npm ci --ignore-scripts

      - name: Configure the bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull live state from live-data
        run: node scripts/live-data.mjs pull

      - name: Re-check every repository (renames, duplicates, archived, 404)
        id: refresh
        # A partial failure still leaves a validated snapshot; the verify step
        # below refuses to publish anything it cannot confirm.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ env.BOT_TOKEN }}
        run: node scripts/fetch-stars.mjs --update

      - name: Remove stale tools
        run: node scripts/prune-stale.mjs --apply --max=25

      - name: Discover new tools
        id: discover
        env:
          GITHUB_TOKEN: ${{ env.BOT_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          LIMIT: ${{ inputs.limit || '45' }}
          MINIMUM: ${{ inputs.minimum || '30' }}
        run: node scripts/discover-tools.mjs --limit="$LIMIT" --min="$MINIMUM"

      - name: Verify the catalog against live GitHub
        env:
          GITHUB_TOKEN: ${{ env.BOT_TOKEN }}
        run: |
          mkdir -p audits
          node scripts/verify-catalog.mjs --base=origin/main --report=audits/verification.md
          npm run validate:catalog

      - name: Save pipeline state to live-data
        if: ${{ !cancelled() }}
        run: |
          node scripts/live-data.mjs push "chore: update catalog pipeline state ($(date -u +%Y-%m-%d))"

      - name: Commit, open the PR and wait for the merge
        id: publish
        env:
          GH_TOKEN: ${{ env.BOT_TOKEN }}
          MERGE_WAIT_SECONDS: '1500'
        run: |
          echo "count=$(jq '.tools | length' src/data/catalog.json)" >> "$GITHUB_OUTPUT"
          bash scripts/open-bot-pr.sh bot/discover-tools "feat(catalog): daily catalog update ($(date -u +%Y-%m-%d))"

      - name: Confirm the live site serves the new catalog
        env:
          EXPECTED: ${{ steps.publish.outputs.count }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          for attempt in $(seq 1 40); do
            live=$(curl -fsS --max-time 20 "$SITE/api/v1/meta.json?run=$GITHUB_RUN_ID-$attempt" | jq -r .toolCount) || live=''
            if [ "$live" = "$EXPECTED" ]; then
              echo "Live site lists $live tools."
              exit 0
            fi
            echo "Attempt $attempt: live site lists '${live:-unreachable}', expected $EXPECTED."
            sleep 20
          done
          echo "::error::Live site does not list $EXPECTED tools."
          exit 1

      - name: Run summary
        if: ${{ !cancelled() }}
        env:
          ADDED: ${{ steps.discover.outputs.added }}
          REFRESH: ${{ steps.refresh.outcome }}
        run: |
          {
            echo "Tools added: ${ADDED:-0} · live refresh: $REFRESH"
            echo
            cat audits/verification.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Raise an alert
        if: ${{ failure() || steps.discover.outputs.short == 'true' || steps.refresh.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.discover.outputs.added }}
          STATUS: ${{ job.status }}
        run: |
          bash scripts/alert-issue.sh daily-pipeline "Daily catalog pipeline needs attention" \
            "Job status: $STATUS. Tools added: ${ADDED:-unknown}. Open the run log to see which step failed or why the daily minimum was not met."
