# Daily discovery of new candidate AI repos (scripts/discover-tools.mjs). Opens a
# DRAFT pull request with entries appended to src/data/tools.ts using cat: 'TODO'
# — a deliberately invalid placeholder — so check-duplicates/CI stays red until a
# human assigns a real category and reviews each entry against
# docs/METHODOLOGY.md. This workflow never merges or pushes to main itself.
#
# Cron is UTC and fixed, so this can't track DST automatically: 11:00 UTC is
# 06:00 Central during CDT (mid-Mar-early Nov, most of the year) but 05:00
# Central during CST (winter) — not 06:00 CST. Accepted as a known ~1hr drift
# twice a year rather than engineering DST-aware double-cron logic for a job
# whose exact hour doesn't matter.
name: Discover new AI tools

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum candidates to draft this run.
        required: false
        type: string
        default: '8'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discover-tools
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Discover candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/discover-tools.mjs --limit="${{ inputs.limit || '8' }}"

      - name: Open a draft PR if anything was drafted
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/tools.ts; then
            echo "No new candidates to propose."
            exit 0
          fi
          branch="discover-tools/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/tools.ts
          git commit -m "chore: draft new AI tool candidates for review"
          git push -u origin "$branch"
          gh pr create \
            --title "Draft: new AI tool candidates ($(date -u +%Y-%m-%d))" \
            --body "Auto-discovered via the GitHub Search API. Every field is copied directly from the repository's own GitHub metadata (description, license, language, topics, stars, creation year) — nothing is generated or invented. \`cat: 'TODO'\` is a deliberate placeholder that fails \`npm run check-duplicates\`; CI stays red until each entry gets a real category from docs/METHODOLOGY.md and an editorial read-through. Reject any entry that doesn't meet the inclusion criteria there." \
            --draft \
            --head "$branch"
