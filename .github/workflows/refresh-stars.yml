# Hourly refresh of live GitHub stats. Fully autonomous, and keeps main clean:
#   - the snapshot is committed to the `live-data` branch (never main), then the
#     Pages deploy is triggered so the site serves fresh numbers;
#   - hard-fact catalog corrections (GitHub archived flag or confirmed 404) go
#     through an auto-merging PR gated by the required CI checks.
# Auth: repo secret KIMI_GITHUB_API (PAT). Its pushes/PRs trigger CI, which the
# default GITHUB_TOKEN would not.
name: Refresh live GitHub stats

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: live-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.KIMI_GITHUB_API || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Load previous snapshot from live-data
        run: node scripts/live-data.mjs pull

      - name: Fetch live GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.KIMI_GITHUB_API || secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-stars.mjs --update

      - name: Publish snapshot to live-data
        run: node scripts/live-data.mjs push "chore: refresh live GitHub stats ($(date -u +%Y-%m-%dT%H:%MZ))"

      - name: Propose archived-status corrections
        env:
          GH_TOKEN: ${{ secrets.KIMI_GITHUB_API || secrets.GITHUB_TOKEN }}
        run: scripts/open-bot-pr.sh bot/archive-status "fix(catalog): mark archived per GitHub (automated, hard-fact only)"

      - name: Redeploy site with fresh stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
