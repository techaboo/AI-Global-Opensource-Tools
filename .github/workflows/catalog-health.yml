name: Catalog health

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load live stats snapshot from live-data branch
        run: node scripts/live-data.mjs pull
      - name: Validate catalog and snapshot
        id: validation
        run: |
          set -o pipefail
          npm run validate:catalog 2>&1 | tee catalog-health.txt
      - name: Verify every repository against live GitHub (dead links, duplicates)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/verify-catalog.mjs 2>&1 | tee -a catalog-health.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-health
          path: catalog-health.txt
          retention-days: 30
      - name: Open or update maintenance issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'Automated catalog health check failed';
            const marker = '<!-- catalog-health-bot -->';
            const body = `${marker}\nThe weekly catalog validation failed. Review the latest **Catalog health** workflow run and its report artifact:\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = issues.find(issue => issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
