# Daily discovery of new candidate AI repos (scripts/discover-tools.mjs).
# Auto-commits straight to main: each candidate must pass a live TypeSafe
# semantic-duplicate check and clear a confidence bar to get a real category
# (never a guess — no key or low confidence means that candidate is skipped,
# not added with a placeholder), plus a deterministic stars-per-day plausibility
# filter. Gated on `npm run check-duplicates` passing before the commit happens.
#
# Cron is UTC and fixed, so this can't track DST automatically: 11:00 UTC is
# 06:00 Central during CDT (mid-Mar-early Nov, most of the year) but 05:00
# Central during CST (winter) — not 06:00 CST. Accepted as a known ~1hr drift
# twice a year rather than engineering DST-aware double-cron logic for a job
# whose exact hour doesn't matter.
name: Discover new AI tools

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum candidates to draft this run.
        required: false
        type: string
        default: '8'

permissions:
  contents: write

concurrency:
  group: discover-tools
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Discover candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/discover-tools.mjs --limit="${{ inputs.limit || '8' }}"

      - name: Validate before committing
        run: |
          if ! git diff --quiet -- src/data/tools.ts; then
            npm run check-duplicates
          fi

      - name: Commit and push if anything was added
        run: |
          if git diff --quiet -- src/data/tools.ts; then
            echo "No new candidates to add."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tools.ts
          git commit -m "feat(catalog): auto-add new AI tool candidates ($(date -u +%Y-%m-%d))"
          git push
