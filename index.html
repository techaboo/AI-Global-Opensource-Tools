<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- __TOOL_COUNT__ / __CATEGORY_COUNT__ are replaced from src/data/tools.ts at
         build and dev-server time (see vite.config.ts) so these never drift from the dataset. -->
    <meta name="description" content="A researched, live-synced catalog of __TOOL_COUNT__ open-source AI tools across __CATEGORY_COUNT__ categories." />
    <meta name="author" content="Techaboo World Solution by Andrew Shannon" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Content-Security-Policy meta is injected at build time only (see vite.config.ts) —
         dev mode needs an inline script for React Fast Refresh that a strict script-src would block. -->
    <title>Open Source AI Atlas</title>

    <!-- Link previews. og:image needs a real image asset, not just a URL, so it stays out
         until one exists; summary cards render fine without one. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://techaboo.github.io/AI-Global-Opensource-Tools/" />
    <meta property="og:site_name" content="Open Source AI Atlas" />
    <meta property="og:title" content="Open Source AI Atlas" />
    <meta property="og:description" content="The living map of open-source AI — __TOOL_COUNT__ tools across __CATEGORY_COUNT__ categories, with live GitHub stats." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Open Source AI Atlas" />
    <meta name="twitter:description" content="The living map of open-source AI — __TOOL_COUNT__ tools across __CATEGORY_COUNT__ categories, with live GitHub stats." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
