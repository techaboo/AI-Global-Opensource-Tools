# Builds and deploys the SPA to GitHub Pages via the Actions-based Pages flow
# (not the legacy gh-pages-branch method). No SPA-fallback/404.html trick is
# needed: this app has no client-side path routing (see src/main.tsx) — all
# state lives in the query string on a single root path.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Triggered by refresh-stars.yml after each hourly snapshot update.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load live stats snapshot from live-data branch
        run: node scripts/live-data.mjs pull
      - run: npm run build
      - name: Record this build's stamp
        id: stamp
        run: echo "generated=$(jq -r .generatedAt dist/api/v1/meta.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
    outputs:
      generated: ${{ steps.stamp.outputs.generated }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}
    outputs:
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}
    steps:
      # The Pages API returns transient 5xx errors, so try three times.
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: second
        if: steps.first.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.second.outcome == 'failure'
        run: sleep 240
      - id: third
        if: steps.second.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Fails the run unless the live site serves this exact build.
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the live site serves this build
        env:
          SITE: ${{ needs.deploy.outputs.url }}
          EXPECTED: ${{ needs.build.outputs.generated }}
        run: |
          for attempt in $(seq 1 20); do
            live=$(curl -fsS --max-time 20 "${SITE%/}/api/v1/meta.json?run=$GITHUB_RUN_ID-$attempt" | jq -r .generatedAt) || live=''
            if [ -n "$EXPECTED" ] && [ "$live" = "$EXPECTED" ]; then
              echo "Live site serves the build from $EXPECTED."
              curl -fsS --max-time 20 -o /dev/null "$SITE"
              curl -fsS --max-time 60 -o /dev/null "${SITE%/}/live-snapshot.json"
              exit 0
            fi
            echo "Attempt $attempt: live build is '${live:-unreachable}', waiting."
            sleep 15
          done
          echo "::error::Live site did not serve the build from $EXPECTED."
          exit 1

  alert:
    needs: [build, deploy, verify]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Raise an alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/alert-issue.sh deploy-pages "GitHub Pages deploy is failing" \
            "A deploy failed after retries. The live site may be serving an older build. Check githubstatus.com and the run log."
