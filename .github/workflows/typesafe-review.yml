# Manual, on-demand semantic review of one catalog entry via scripts/review-tool.mjs.
# Auth: repo secret TYPESAFE_API_KEY. No schedule and no push/pull_request trigger —
# this calls a paid external API, so it only ever runs when someone explicitly
# dispatches it, never automatically on a PR.
name: TypeSafe tool review

on:
  workflow_dispatch:
    inputs:
      tool_id:
        description: Catalog tool id to review (src/data/catalog.json), or a path to a candidate JSON file checked into the repo.
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run semantic review
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TOOL_ID: ${{ inputs.tool_id }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::warning::TYPESAFE_API_KEY secret is not set — the review will skip and exit 0."
          fi
          set -o pipefail
          node scripts/review-tool.mjs "$TOOL_ID" | tee -a "$GITHUB_STEP_SUMMARY"
