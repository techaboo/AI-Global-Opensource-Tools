# Weekly removal of stale tools (scripts/prune-stale.mjs): archived ones, and
# repos with no push in 18 months (foundation models exempt from the inactivity
# rule). Removals become an auto-merging PR gated by the required CI checks.
name: Remove stale tools

on:
  schedule:
    - cron: '30 13 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: live-data-writer
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # A PAT so the PR triggers CI (GITHUB_TOKEN-created PRs do not).
          token: ${{ secrets.KIMI_GITHUB_API || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Load live stats snapshot from live-data
        run: node scripts/live-data.mjs pull

      - name: Remove stale tools
        run: node scripts/prune-stale.mjs --apply --max=25

      - name: Open auto-merging PR for removals
        env:
          GH_TOKEN: ${{ secrets.KIMI_GITHUB_API || secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/open-bot-pr.sh bot/prune-stale "chore(catalog): remove stale tools ($(date -u +%Y-%m-%d))"
