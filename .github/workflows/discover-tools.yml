# Daily discovery of new AI repos (scripts/discover-tools.mjs). Fully autonomous:
# accepted candidates become an auto-merging PR, which only lands after the
# required CI checks (lint, catalog validation, unit + browser tests, build) pass.
# Reject memory goes to the live-data branch, so main only changes when tools
# are actually added. Each candidate must pass a live TypeSafe duplicate check
# and a category-confidence bar, plus a stars-per-day plausibility filter.
name: Discover new AI tools

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum candidates to add this run.
        required: false
        type: string
        default: '8'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: live-data-writer
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # A PAT so the PR triggers CI (GITHUB_TOKEN-created PRs do not).
          token: ${{ secrets.KIMI_GITHUB_API || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Load reject memory from live-data
        run: node scripts/live-data.mjs pull

      - name: Discover candidates
        env:
          GITHUB_TOKEN: ${{ secrets.KIMI_GITHUB_API || secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          LIMIT: ${{ inputs.limit || '8' }}
        run: node scripts/discover-tools.mjs --limit="$LIMIT"

      - name: Save reject memory to live-data
        if: always()
        run: node scripts/live-data.mjs push "chore: update tool-discovery reject memory ($(date -u +%Y-%m-%d))"

      - name: Open auto-merging PR for new tools
        env:
          GH_TOKEN: ${{ secrets.KIMI_GITHUB_API || secrets.GITHUB_TOKEN }}
        run: scripts/open-bot-pr.sh bot/discover-tools "feat(catalog): auto-add new AI tool candidates ($(date -u +%Y-%m-%d))"
