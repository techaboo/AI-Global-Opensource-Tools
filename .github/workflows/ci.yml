name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check for duplicate catalog entries
        run: npm run check-duplicates

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build (includes typecheck)
        run: npm run build
