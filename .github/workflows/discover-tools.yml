# Daily catalog pipeline, fully autonomous and in this order:
#   1. pull the live state and re-check every repository on GitHub
#   2. remove stale tools
#   3. discover new tools (at least MIN per day, spread across categories)
#   4. verify the result against live GitHub (dead links, duplicates, archived)
#   5. open a PR, wait for the required CI checks and the auto-merge
#   6. confirm the live site serves the new catalog
# Any failure, or a day below the minimum, opens a tracking issue.
name: Daily catalog pipeline

on:
  schedule:
    # Off the hour, so it does not collide with the hourly stats refresh.
    - cron: '20 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum tools to add this run.
        required: false
        type: string
        default: '45'
      minimum:
        description: Daily minimum; the run reports a shortfall below this.
        required: false
        type: string
        default: '30'

permissions:
  contents: write
  pull-requests: write
  # open-bot-pr.sh starts CI and the Pages deploy when running on the built-in token.
  actions: write

concurrency:
  group: live-data-writer
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      added: ${{ steps.discover.outputs.added }}
      short: ${{ steps.discover.outputs.short }}
      refresh: ${{ steps.refresh.outcome }}
      pat: ${{ steps.token.outputs.pat }}
    steps:
      # Before checkout, so an expired or revoked PAT cannot stop the run. Without a
      # working PAT the built-in token is used and open-bot-pr.sh starts CI and the
      # Pages deploy itself (events from the built-in token trigger no workflows).
      - name: Pick a working bot token
        id: token
        env:
          PAT: ${{ secrets.KIMI_GITHUB_API }}
          FALLBACK: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$PAT" ] && [ "$(GH_TOKEN="$PAT" gh api "repos/$REPO" --jq .permissions.push 2>/dev/null)" = true ]; then
            kind=pat; pat=ok
          else
            kind=github; pat=$([ -n "$PAT" ] && echo failed || echo missing)
            echo "::warning::KIMI_GITHUB_API was not usable (status: $pat); continuing with the built-in token."
          fi
          token=$([ "$kind" = pat ] && echo "$PAT" || echo "$FALLBACK")
          { echo "BOT_TOKEN=$token"; echo "BOT_TOKEN_KIND=$kind"; } >> "$GITHUB_ENV"
          echo "pat=$pat" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ env.BOT_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # No dependency install scripts run in a job that holds a write token.
      - run: npm ci --ignore-scripts

      - name: Configure the bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull live state from live-data
        run: node scripts/live-data.mjs pull

      - name: Re-check every repository (renames, duplicates, archived, 404)
        id: refresh
        # A partial failure still leaves a validated snapshot; the verify step
        # below refuses to publish anything it cannot confirm.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ env.BOT_TOKEN }}
        run: node scripts/fetch-stars.mjs --update

      - name: Remove stale tools
        run: node scripts/prune-stale.mjs --apply --max=25

      - name: Discover new tools
        id: discover
        timeout-minutes: 55
        env:
          GITHUB_TOKEN: ${{ env.BOT_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          LIMIT: ${{ inputs.limit || '45' }}
          MINIMUM: ${{ inputs.minimum || '30' }}
        run: node scripts/discover-tools.mjs --limit="$LIMIT" --min="$MINIMUM" --max-minutes=45

      - name: Verify the catalog against live GitHub
        env:
          GITHUB_TOKEN: ${{ env.BOT_TOKEN }}
        run: |
          mkdir -p audits
          node scripts/verify-catalog.mjs --base=origin/main --report=audits/verification.md
          npm run validate:catalog

      - name: Save pipeline state to live-data
        if: ${{ !cancelled() }}
        run: |
          node scripts/live-data.mjs push "chore: update catalog pipeline state ($(date -u +%Y-%m-%d))"

      - name: Commit, open the PR and wait for the merge
        env:
          GH_TOKEN: ${{ env.BOT_TOKEN }}
          MERGE_WAIT_SECONDS: '1500'
        run: |
          bash scripts/open-bot-pr.sh bot/discover-tools "feat(catalog): daily catalog update ($(date -u +%Y-%m-%d))"

      - name: Confirm the live site serves the new catalog
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node scripts/check-live.mjs "$SITE"

      - name: Run summary
        if: ${{ !cancelled() }}
        env:
          ADDED: ${{ steps.discover.outputs.added }}
          REFRESH: ${{ steps.refresh.outcome }}
        run: |
          {
            echo "Tools added: ${ADDED:-0} · live refresh: $REFRESH"
            echo
            cat audits/verification.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  # A separate job with its own checkout: it still reports when the pipeline job
  # timed out, was cancelled, or could not check out with the bot token.
  alert:
    needs: pipeline
    if: >-
      always() && (needs.pipeline.result != 'success'
      || needs.pipeline.outputs.short == 'true'
      || needs.pipeline.outputs.refresh == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Raise an alert
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ needs.pipeline.outputs.added }}
          RESULT: ${{ needs.pipeline.result }}
        run: |
          bash scripts/alert-issue.sh daily-pipeline "Daily catalog pipeline needs attention" \
            "Job result: $RESULT. Tools added: ${ADDED:-unknown}. Open the run log to see which step failed or why the daily minimum was not met."

  # The run itself carried on with the built-in token; renewing the PAT restores
  # its higher API limits.
  token-alert:
    needs: pipeline
    if: always() && needs.pipeline.outputs.pat == 'failed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Raise an alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/alert-issue.sh bot-token "Bot token KIMI_GITHUB_API is expired or invalid" \
            "GitHub rejected the KIMI_GITHUB_API secret. The automation keeps running on the built-in token, but with lower API limits. Create a new token and update the repository secret."
